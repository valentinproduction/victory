spring.application.name=victory

# URL для підключення до MySQL. `microservices_db` - це назва нашої схеми.
spring.datasource.url=jdbc:mysql://localhost:3306/microservices_db
# Ім'я користувача для підключення
spring.datasource.username=root
# Пароль для підключення
spring.datasource.password=1234

# Вказуємо Hibernate, який діалект SQL використовувати для MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ця властивість вказує Hibernate автоматично оновлювати схему БД
# на основі ваших Entity-класів при запуску додатку.
# Дуже зручно для розробки, але в production-середовищі слід використовувати
# інструменти для міграцій, такі як Flyway або Liquibase.
spring.jpa.hibernate.ddl-auto=update
